name: solar-system
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: install npm
        run: npm install
      - name: run unit tests
        run: npm test
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report