name: solar-system
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    environment: solar-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: install npm
        run: npm install
      - name: run unit test
        if: always()
        env:
          MONGO_URI: ${{ vars.MONGO_URI }}
          MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: npm test
     